<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Kit tracker">
<meta name="theme-color" content="#1B7875">
<link rel="manifest" href="/manifest.webmanifest">
<title>Lab kit tracker</title>
<style>
:root{--primary:#1B7875;--dark:#0F4D4B;--accent:#FF7A59;--bg:#F4F7F7;--card:#fff;--ink:#1D2B2A;--muted:#5C6F6E;--line:#D5E2E1;--ok:#15803D;--okbg:#E7F5EC;--warn:#92400E;--warnbg:#FEF3C7;--err:#B42318;--errbg:#FDECEA}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--bg:#0E1A19;--card:#152625;--ink:#E6F0EF;--muted:#9BB3B1;--line:#264240;--ok:#4ADE80;--okbg:#16352A;--warn:#FBBF24;--warnbg:#3A2E12;--err:#F87171;--errbg:#3A1C1C}}
:root[data-theme="dark"]{--bg:#0E1A19;--card:#152625;--ink:#E6F0EF;--muted:#9BB3B1;--line:#264240;--ok:#4ADE80;--okbg:#16352A;--warn:#FBBF24;--warnbg:#3A2E12;--err:#F87171;--errbg:#3A1C1C}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 Inter,system-ui,-apple-system,Segoe UI,Roboto,sans-serif;padding-bottom:env(safe-area-inset-bottom)}
#app{max-width:820px;margin:0 auto;padding:12px 14px 40px}
h1{font-size:22px;margin:4px 0 6px;color:var(--dark)} h2{font-size:17px;margin:0 0 6px}
.muted{color:var(--muted)} .small{font-size:14px} .ok{color:var(--ok)} .err{color:var(--err)}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px;margin:10px 0}
.login{max-width:420px;margin:40px auto}
.top{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;padding:6px 0}
.status{display:flex;gap:6px;flex-wrap:wrap;margin:4px 0 8px}
.pill{font-size:13px;border-radius:999px;padding:3px 10px;background:var(--line);color:var(--ink)}
.pill.ok{background:var(--okbg);color:var(--ok)} .pill.warn{background:var(--warnbg);color:var(--warn)} .pill.err{background:var(--errbg);color:var(--err)}
.tabs,.seg{display:flex;gap:6px;flex-wrap:wrap;margin:6px 0}
.tabs button,.seg button{flex:1 1 auto;min-height:44px;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:10px;padding:8px 12px;font:inherit;cursor:pointer}
.tabs button.on,.seg button.on{background:var(--primary);color:#fff;border-color:var(--primary)}
button{font:inherit;cursor:pointer;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--ink);min-height:44px;padding:8px 14px}
button.primary{background:var(--primary);border-color:var(--primary);color:#fff}
button.big{min-height:52px;font-size:17px;width:100%}
button.link{border:none;background:none;color:var(--primary);padding:4px 0;min-height:auto;text-decoration:underline}
button:disabled{opacity:.6}
button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
label{display:block;font-size:14px;color:var(--muted);margin-bottom:10px}
input,select{display:block;width:100%;margin-top:4px;min-height:48px;font:inherit;font-size:17px;color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px 12px}
.stack{display:flex;flex-direction:column;gap:2px}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px;align-items:end}
@media (max-width:520px){.row2{grid-template-columns:1fr}.tabs{flex-wrap:nowrap;gap:4px}.tabs button{flex:1 1 0;min-width:0;padding:8px 2px;font-size:14px}}
.msg{border-radius:10px;padding:10px 12px;margin:8px 0}
.msg.ok{background:var(--okbg);color:var(--ok)} .msg.err{background:var(--errbg);color:var(--err)}
.warnbox{background:var(--warnbg);border-color:transparent}
.list{padding-left:18px} .list li{margin:8px 0}
.toolbar{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin:8px 0}
.table-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:12px;background:var(--card)}
table{border-collapse:collapse;width:100%;font-size:14px}
th,td{text-align:left;padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
th{color:var(--muted);font-weight:600;background:var(--bg)}
tr.pending td{background:var(--warnbg)}
.tag{font-size:12px;background:var(--warnbg);color:var(--warn);border-radius:6px;padding:1px 6px}
.filebtn{display:flex;align-items:center;justify-content:center;min-height:52px;font-size:17px;color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:10px;padding:8px 14px;margin:0;cursor:pointer;text-align:center}
.filebtn:focus-within{outline:3px solid var(--accent);outline-offset:2px}
.vh{position:absolute;width:1px;height:1px;min-height:0;padding:0;margin:0;border:0;opacity:0;overflow:hidden}
.hint{margin:-4px 0 10px}
button.pill{min-height:auto;border:none;padding:3px 10px;border-radius:999px;cursor:pointer}
dialog.alerts{width:min(560px,calc(100vw - 32px));max-height:85vh;overflow:auto;background:var(--card);color:var(--ink);border:1px solid var(--line);border-radius:14px;padding:16px}
dialog.alerts::backdrop{background:rgba(0,0,0,.5)}
.alert-row{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 0;border-top:1px solid var(--line)}
.alert-row button{flex:none;min-height:40px;padding:4px 10px;font-size:14px}
.alert-row .kind{display:block;font-size:12px;font-weight:600;text-transform:uppercase;letter-spacing:.04em}
.kind.expired,.kind.low{color:var(--err)} .kind.expiring{color:var(--warn)}
.actions{display:flex;gap:10px;margin-top:12px}
.actions button{flex:1}
.schedule{margin:6px 0 12px;padding-left:18px;font-size:14px}
.schedule li{margin:2px 0}
.preview{display:block;max-width:100%;max-height:240px;border-radius:10px;margin:10px auto 4px}
.study-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:12px;margin:10px 0}
.scard{display:flex;flex-direction:column;gap:4px;text-align:left;padding:14px;border-radius:12px;width:100%}
.scard:hover{border-color:var(--primary)}
.srow{display:flex;justify-content:space-between;align-items:center;gap:8px}
.smx{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:8px;font-size:12px;color:var(--muted)}
.smx span{display:flex;flex-direction:column}
.smx b{font-size:20px;color:var(--ink)}
details{margin-top:10px}
summary{cursor:pointer;color:var(--primary);font-weight:600;min-height:32px}
details form{margin-top:8px}
td select{min-height:36px;width:auto;margin:0;padding:4px 8px;font-size:14px}
h3{font-size:15px;margin:12px 0 2px}
</style>
</head>
<body>
<div id="app"><p class="muted" style="padding:40px;text-align:center">Loading…</p></div>
<dialog id="alertDialog" class="alerts"></dialog>
<script src="/label.js"></script>
<script src="/alerts.js"></script>
<script src="/reader.js"></script>
<script src="/app.js"></script>
</body>
</html>
